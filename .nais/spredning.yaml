apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spredning
  namespace: tbd
  labels:
    team: tbd
spec:
  replicas:
    max: 1
    min: 1
  port: 8080
  liveness:
    path: /isAlive
  readiness:
    path: /isReady
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        extra:
          - NAVident
    sidecar:
      enabled: true
      autoLogin: true
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
